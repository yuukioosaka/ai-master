---
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.default_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ "/" | relative_url }}">{{ site.data.t[page.lang].site_title }}</a>
      <nav>
        <a href="{{ "/" | relative_url }}">{{ site.data.t[page.lang].nav_home }}</a>
        <a href="{{ "/about/" | relative_url }}">{{ site.data.t[page.lang].nav_about }}</a>
        {% if page.lang == 'ja' %}
          <a href="/en/">EN</a>
        {% else %}
          <a href="/">JA</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="wrapper">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>{{ site.data.t[page.lang].footer_copyright }}</p>
    </div>
  </footer>
</body>
</html>
