  <!-- outer rounded square -->
  <rect x="24" y="24" width="464" height="464" rx="56" fill="#2c3e50"/>
  <!-- inner card -->
  <rect x="52" y="52" width="408" height="408" rx="28" fill="#ffffff"/>

  <!-- level English name -->
  <text x="256" y="130" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="#2c3e50" text-anchor="middle" letter-spacing="1">Steward</text>

  <!-- level number -->
