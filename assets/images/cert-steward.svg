  <!-- tagline -->
  <!-- footer -->
  <text x="256" y="430" font-family="'Open Sans',sans-serif" font-size="34" font-weight="800" fill="#2c3e50" text-anchor="middle" letter-spacing="1">AI MASTER CERTIFIED</text>
