<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AI MASTER Foundation certification badge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f39c12"/>
      <stop offset="1" stop-color="#d68910"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- outer rounded square -->
  <rect x="24" y="24" width="464" height="464" rx="56" fill="url(#bg)"/>
  <!-- glossy top highlight -->
  <rect x="24" y="24" width="464" height="170" rx="56" fill="url(#glow)"/>
  <rect x="24" y="140" width="464" height="54" fill="url(#glow)"/>
  <!-- thin border ring -->
  <rect x="38" y="38" width="436" height="436" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>

  <!-- inner medallion -->
  <circle cx="256" cy="256" r="150" fill="#ffffff"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#d68910" stroke-opacity="0.35" stroke-width="4"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#d68910" stroke-opacity="0.7" stroke-width="2"/>

  <!-- level English name -->
  <text x="256" y="200" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#d68910" text-anchor="middle" letter-spacing="1">Foundation</text>

  <!-- level number -->
  <text x="248" y="360" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-size="180" font-weight="800" fill="url(#bg)" text-anchor="middle">1</text>

  <!-- footer -->
  <text x="256" y="452" font-family="'Open Sans',sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">AI MASTER CERTIFIED</text>
</svg>
